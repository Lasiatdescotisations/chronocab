<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antevorta — temps & cycle de paie</title>
<meta name="theme-color" content="#0d6656">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Antevorta">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d6656'/%3E%3Cg transform='translate(4.5 4) scale(.95)' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'%3E%3Ccircle cx='12' cy='13.5' r='8.3'/%3E%3Cpath d='M12 9.2v4.5l3 2.1M9.6 2.2h4.8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pf-brown:#8a5a2e;
  --brand-font:'Cinzel','Trajan Pro',Georgia,serif; --brand-ls:.05em; --quote-font:Georgia,'Times New Roman',serif;
  color-scheme: light;
  --bg:#f5f4f0; --surface:#ffffff; --surface-2:#f0eee9; --surface-3:#e8e6e0;
  --line:#e2dfd8; --line-2:#d3cfc6;
  --ink:#17191c; --ink-2:#4f5157; --muted:#878880;
  --accent:#0d6656; --accent-2:#0a5244; --accent-soft:#e1efeb; --accent-ink:#ffffff;
  --stop:#c2362b; --stop-2:#a52c22; --stop-soft:#f9e6e3;
  --s-inv:#2a78d6; --s-todo:#eb6834; --s-nobill:#1baf7a;
  --todo-soft:#fcebe2; --inv-soft:#e3eefb; --nobill-soft:#eceae5;
  --shadow:0 1px 2px rgba(20,20,10,.05), 0 4px 16px rgba(20,20,10,.05);
  --r:10px;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --pf-brown:#c48a55;
    --bg:#141513; --surface:#1c1d1b; --surface-2:#232421; --surface-3:#2c2d2a;
    --line:#30312d; --line-2:#3c3d38;
    --ink:#efeee9; --ink-2:#c1c0b7; --muted:#8d8c84;
    --accent:#2fa58c; --accent-2:#3bb99e; --accent-soft:#18332d; --accent-ink:#0b1210;
    --stop:#e0574b; --stop-2:#ea6c60; --stop-soft:#3a1d1a;
    --s-inv:#3987e5; --s-todo:#d95926; --s-nobill:#199e70;
    --todo-soft:#3a2418; --inv-soft:#1a2a3d; --nobill-soft:#2a2b27;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);padding:0;margin:0;vertical-align:middle;box-shadow:none}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 20px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;font-size:15px;white-space:nowrap}
.brand .txt{font-family:var(--brand-font);font-weight:600;letter-spacing:var(--brand-ls);font-size:17px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.nav{display:flex;gap:2px;height:100%}
.nav a{display:flex;align-items:center;padding:0 13px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
.nav a .sm{display:none}
.nav a[hidden],.top-right [hidden]{display:none!important}
/* Petites icônes à droite du nom des onglets (ordinateur) */
@media (min-width:701px){
  .nav a{gap:0}
  .nav a svg{display:block;order:2;width:15px;height:15px;margin-left:6px;opacity:.55;flex:none;transition:opacity .15s,color .15s}
  .nav a:hover svg,.nav a.on svg{opacity:.9}
  .nav a .count{order:3}
  .nav a[data-view=portefeuille] svg{display:none}
}
@media (min-width:701px) and (max-width:1540px){ .nav a .lg{display:none} .nav a .sm{display:inline} .nav a{padding:0 10px} .nav a svg{margin-left:5px} }
@media (min-width:701px) and (max-width:1180px){ .nav a{padding:0 7px} .nav a svg{display:none} }
@media (min-width:701px) and (max-width:1340px){ .nav a{padding:0 8px} .top-right{gap:9px} .pill .what{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} }
@media (min-width:701px) and (max-width:1180px){ .pill .what{display:none} }
/* Chrono en cours : icône animée (vert) ; appel en cours : rouge */
.nav a.run svg{color:var(--accent);opacity:1;animation:navRun 1.6s ease-in-out infinite}
.nav a.call svg{color:#c0392b;opacity:1;animation:navRun 1.1s ease-in-out infinite}
.nav a.run::after,.nav a.call::after{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.nav a.call::after{background:#c0392b}
.nav a[data-view=chrono]{position:relative}
@media (min-width:701px){ .nav a.run::after,.nav a.call::after{right:6px;top:14px} }
@keyframes navRun{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.nav a.run svg,.nav a.call svg{animation:none}}
.nav .count{margin-left:6px;font-size:11px;font-family:var(--mono);background:var(--todo-soft);color:var(--ink);border-radius:20px;padding:1px 7px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.ver{font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap;display:inline-flex;flex-direction:column;align-items:center;line-height:1.1}
.ver-a{font-family:var(--font, system-ui);font-size:20px;font-weight:700;color:var(--accent);line-height:.95}
.hist-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;color:var(--ink-2)}
.hist-btn svg{width:18px;height:18px}
.hist-btn.on{background:var(--accent-soft);color:var(--accent)}
/* Mode appel (interruption) */
.hist-btn.call-btn{width:auto;min-width:32px;padding:0 7px;gap:6px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.hist-btn.call-btn svg{flex:none}
.hist-btn.call-btn .call-t{display:none;font-size:12px;font-weight:600}
.hist-btn.call-btn.on{background:#c0392b;color:#fff;animation:callPulse 2s ease-in-out infinite}
.hist-btn.call-btn.on .call-t{display:inline}
@keyframes callPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.35)}50%{box-shadow:0 0 0 5px rgba(192,57,43,0)}}
@media (prefers-reduced-motion:reduce){.hist-btn.call-btn.on{animation:none}}
.call-bar{position:fixed;right:18px;bottom:18px;z-index:70;width:min(430px,calc(100vw - 36px));background:var(--surface);border:1px solid var(--line-2);border-left:4px solid #c0392b;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:12px 14px;display:grid;gap:9px}
.call-bar .cb-top{display:flex;align-items:center;gap:10px}
.call-bar .cb-ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,#c0392b 14%,var(--surface));color:#c0392b;flex:none}
.call-bar .cb-ic svg{width:16px;height:16px}
.call-bar .cb-t{font-size:22px;font-weight:600;margin-left:auto;font-variant-numeric:tabular-nums}
.call-bar .cb-int{font-size:12px;color:var(--ink-2)}
.call-bar .cb-row{display:flex;gap:8px;align-items:center}
.call-bar select,.call-bar input{flex:1;min-width:0;font-size:13px;padding:6px 8px}
.call-bar.min .cb-more{display:none}
.call-kinds{display:flex;gap:6px;flex-wrap:wrap}
.call-k{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.call-k.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.call-sum{background:var(--surface-2);border-radius:8px;padding:9px 11px;font-size:13px}
.call-sum b{font-size:15px}
@media (max-width:700px){.call-bar{right:8px;left:8px;width:auto;bottom:74px}}
.hist-pan{position:fixed;top:58px;right:16px;width:420px;max-width:calc(100vw - 24px);max-height:calc(100vh - 80px);overflow:auto;z-index:60;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.hist-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.hist-h b{font-size:14px}
.hist-i{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.hist-i:last-child{border-bottom:0}
.hist-l{font-size:13px;font-weight:500;line-height:1.35}
.hist-m{font-size:11.5px;color:var(--muted);grid-column:1}
.hist-i .btn{grid-row:1 / span 2;grid-column:2}
.hist-i.done .hist-l{color:var(--muted);text-decoration:line-through}
.hist-i.jwarn .hist-m{color:var(--stop);grid-column:1 / -1}
.hist-i.jwarn .hist-l{grid-column:1 / -1}
.hist-empty{padding:22px 14px;color:var(--muted);font-size:13px;text-align:center}
@media (max-width:700px){ .hist-pan{top:auto;bottom:70px;left:8px;right:8px;width:auto;max-height:70vh} }
.sync{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--accent)} .sync.busy i{background:var(--s-todo)} .sync.err i{background:var(--stop)}
.pill{display:flex;align-items:center;gap:8px;background:var(--stop-soft);border-radius:30px;padding:4px 4px 4px 12px;font-size:13px;max-width:360px}
.pill .what{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .num{font-weight:600}
.pill button{border:0;background:var(--stop);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}

main{max-width:1380px;margin:0 auto;padding:22px 20px 80px}
.view{display:none}.view.on{display:block}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:28px 0 10px}
h2:first-child{margin-top:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:12px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--stop);border-color:color-mix(in srgb,var(--stop) 40%,var(--line-2))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.icon{border:0;background:transparent;width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.icon svg,.btn svg{width:16px;height:16px}

/* ---------- Timer bar ---------- */
.timerbar{display:flex;align-items:stretch;gap:0;padding:8px;position:sticky;top:68px;z-index:20}
.tb-fields{display:grid;grid-template-columns:minmax(150px,1.05fr) minmax(150px,1.1fr) minmax(180px,1.7fr);gap:6px;flex:1;min-width:0}
.tb-fields input{border-color:transparent;background:var(--surface-2);height:44px;font-size:15px}
.tb-fields input:focus{background:var(--surface)}
.tb-side{display:flex;align-items:center;gap:8px;padding-left:10px}
.bill{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:4px 10px 4px 8px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s-todo)}
.bill.no::before{background:var(--s-nobill)}
.bill.inv::before{background:var(--s-inv)}
.bill:hover{background:var(--surface-2)}
.tb-side .bill{height:34px;padding:0 12px 0 10px;font-size:13px}
.clock{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.01em;border:0;background:transparent;padding:0 6px;min-width:128px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.clock.idle{color:var(--muted)}
.go{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;transition:transform .08s}
.go:hover{background:var(--accent-2)} .go:active{transform:scale(.95)}
.go.stop{background:var(--stop)} .go.stop:hover{background:var(--stop-2)}
.go.add{width:auto;border-radius:24px;padding:0 18px;font-weight:600}
.go svg{width:20px;height:20px}
.modes{display:flex;flex-direction:column;gap:2px;margin-left:2px}
.modes button{border:0;background:transparent;color:var(--muted);width:28px;height:23px;border-radius:5px;display:grid;place-items:center}
.modes button.on{color:var(--accent);background:var(--accent-soft)}
.modes svg{width:15px;height:15px}
.manual{display:flex;align-items:center;gap:6px}
.manual input{height:38px}
.manual input.hm{width:76px;font-family:var(--mono);text-align:center}
.tb-sub{display:flex;align-items:center;gap:10px;padding:6px 6px 0;color:var(--muted);font-size:12px;min-height:10px}
.tb-sub input{padding:2px 6px;font-size:12px;width:64px;font-family:var(--mono);text-align:center}
.warn{background:var(--todo-soft);color:var(--ink);padding:8px 12px;border-radius:8px;font-size:13px;margin-top:10px;display:flex;gap:10px;align-items:center}

/* combobox */
.combo{position:relative;min-width:0}
.combo input{width:100%}
.combo-list{position:absolute;left:0;top:calc(100% + 4px);min-width:100%;width:max-content;max-width:420px;max-height:320px;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:50;padding:4px;display:none}
.combo.open .combo-list{display:block}
.opt{padding:7px 9px;border-radius:6px;display:flex;align-items:center;gap:8px;cursor:pointer}
.opt.hi{background:var(--accent-soft)}
.opt .sub{color:var(--muted);font-size:12px;margin-left:auto;padding-left:14px}
.opt.create{color:var(--accent);font-weight:500}
.int-ic{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--accent-soft);color:var(--accent);flex:none}
.int-ic svg{width:12px;height:12px}
.pers-ic{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);flex:none}
.pers-ic svg{width:12px;height:12px}
.what .role,.chip .role{font-size:11px;color:var(--muted);white-space:nowrap}
.ext{font-size:11px;color:var(--ink-2);background:var(--surface-3);border-radius:10px;padding:1px 7px;white-space:nowrap}
.pf{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12px;white-space:nowrap;color:var(--muted)}
.pf.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line-2));color:var(--accent);font-weight:600}
.ref-tools{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ref-tools input{flex:1;min-width:160px}
.clients-card .ref-list{max-height:560px}
.month-nav{display:flex;align-items:center;gap:6px;font-size:16px}
.month-nav .icon{font-size:20px;line-height:1}
.month-nav .icon:disabled{opacity:.3;cursor:default}
.stat .of{font-size:14px;color:var(--muted)}
.up{color:var(--accent);font-size:11px;white-space:nowrap}
.down{color:var(--stop);font-size:11px;white-space:nowrap}
.ok{color:var(--accent);font-weight:700}
.ko{color:var(--line-2)}
.t th.c,.t td.c{text-align:center}
.t th .sort{border:0;background:transparent;font:inherit;font-weight:600;color:inherit;padding:0;cursor:pointer;white-space:nowrap}
.t th .sort.on{color:var(--accent)}
.pf-row.idle td{color:var(--muted)}
.pf-row.idle .pf-name{color:var(--ink-2)}
.pf-row:hover td{background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
.pf-name{font-weight:600;white-space:nowrap}
.icon.xs{width:26px;height:26px}
.icon.xs svg{width:13px;height:13px}
.pf-detail td{background:var(--surface-2)}
.pf-tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.pf-task{display:flex;gap:10px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.pf-task span:first-child{flex:1;font-weight:500}
.pf-head .seg{margin-right:8px}
.filters label.chk{flex-direction:row;align-items:center;gap:6px}
.filters label.chk input{width:auto;padding:0}
.cy-table th,.cy-table td{padding:6px 8px}
.cy-table td.cy-name{position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px}
.cy-name .what{padding:0}
.cy-name .what .cl{max-width:230px}
.cy-perm{font-size:11px;color:var(--muted);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cy-note-ic{font-size:11px}
.cy-cell{text-align:center;cursor:pointer;font-family:var(--mono);font-weight:600;min-width:58px;border-left:1px solid var(--line);user-select:none;white-space:nowrap}
.cy-cell:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.cy-cell.st-done{background:var(--accent-soft);color:var(--accent)}
.cy-cell.st-warn{background:var(--todo-soft)}
.cy-cell.st-late{background:var(--stop-soft);color:var(--stop)}
.cy-cell.st-na,.cy-cell.st-auto{background:var(--surface-2);color:var(--muted);font-family:var(--sans);font-weight:400;font-size:12px}
.cy-cell.st-rel{background:var(--todo-soft)}
.cy-cell.st-todo:empty::after,.cy-cell.st-warn:empty::after,.cy-cell.st-late:empty::after{content:"+";color:var(--line-2);font-weight:400}
.cy-r{color:var(--s-todo);font-weight:700;margin-right:1px}
.cy-cell sup{font-size:9px;color:var(--muted);margin-left:1px}
.cy-lbl{font-size:11px}
.cy-in{border-color:transparent;background:transparent;padding:4px 6px;width:120px}
.cy-in:hover{border-color:var(--line)}
.cy-in.num{width:52px;text-align:center;font-family:var(--mono);font-weight:600}
.cy-in.sugg{color:var(--muted);font-style:italic;font-weight:400}
.cy-in.wide{width:200px}
.cy-fin td{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.cy-fin td.cy-name{background:color-mix(in srgb,var(--accent-soft) 35%,var(--surface))}
.cy-tri{border:1px solid var(--line-2);border-radius:12px;background:var(--surface);font-size:11px;padding:2px 9px;min-width:44px}
.cy-tri.v-ok{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.cy-tri.v-none{color:var(--stop)}
.cy-todo{margin-top:12px;padding:10px 14px}
.cy-todo-h{font-weight:600;margin-bottom:4px}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}
.more{display:flex;justify-content:center;margin-top:16px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px}
.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.filters select,.filters input{padding:6px 8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:13px;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* chart */
.chart-wrap{padding:14px 16px 8px;position:relative}
.chart-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .hit{fill:transparent}
svg.chart .hit:hover{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:8px 10px;font-size:12px;min-width:170px;z-index:5}
.tip .h{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tip .r span{display:flex;align-items:center;gap:6px}
.tip i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* tables */
.tbl-wrap{overflow:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:12px;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t td.n,.t th.n{text-align:right;white-space:nowrap}
.t td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.t tr.grp td{font-weight:600;background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.t tr.sub td:first-child{padding-left:30px;color:var(--ink-2)}
.t tr.tot td{font-weight:700;border-top:2px solid var(--line-2);border-bottom:0}
.t .zero{color:var(--line-2)}
.t td.lab{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s-todo)}
.status.inv::before{background:var(--s-inv)} .status.no::before{background:var(--s-nobill)}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:28px 0 10px}
.toolbar h2{margin:0}
/* Carnet de bord */
.cb-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cb-tools #cb-q{flex:1;min-width:220px}
a.btn{text-decoration:none}
a.btn:not(.primary){color:var(--ink)}
@media (max-width:1520px) and (min-width:701px){.sync span{display:none}}
.cb-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cb-tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:grid;gap:7px;align-content:start;min-height:118px;transition:border-color .15s,box-shadow .15s}
.cb-tile:hover,.cb-tile:focus-visible{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.cb-tile.other{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.cb-tile .t1{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;line-height:1.25}
.cb-tile .t1 .nm{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cb-tile .t2{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cb-tile .ccn{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-tile .ccn.none{color:var(--muted);font-style:italic}
.cb-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.cb-b{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.cb-b.warn{background:color-mix(in srgb,#d9822b 16%,var(--surface));color:color-mix(in srgb,#b0611a 80%,var(--ink))}
.cb-b.late{background:color-mix(in srgb,#c0392b 14%,var(--surface));color:color-mix(in srgb,#b03a2e 85%,var(--ink))}
.cb-b.rel-fluide{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.cb-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cb-head h1{font-size:22px;margin:0;font-weight:650;display:flex;align-items:center;gap:9px}
.cb-head .pf-ic{display:inline-flex}
.cb-pf{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--pf-brown) 15%,var(--surface));color:var(--pf-brown)}
.cb-pf.other{background:var(--surface-3);color:var(--ink-2)}
.cb-sec{padding:14px 16px;display:grid;gap:10px}
.cb-kv{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:6px 14px;font-size:13px}
.cb-kv dt{color:var(--muted)}
.cb-kv dd{margin:0}
.cb-ccn{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.cb-ccn .ci{font-family:var(--mono,monospace);font-weight:700;font-size:13px;min-width:46px}
.cb-ccn .ct{flex:1;font-size:13px;line-height:1.35}
.cb-ccn .cs{font-size:11.5px;color:var(--muted);margin-top:2px}
.ccn-search{position:relative}
.ccn-search input{width:100%;box-sizing:border-box}
.ccn-res{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.14);max-height:320px;overflow:auto;padding:4px}
.ccn-res button{all:unset;box-sizing:border-box;display:flex;gap:10px;width:100%;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px;align-items:baseline}
.ccn-res button:hover,.ccn-res button.hi{background:var(--accent-soft)}
.ccn-res .ri{font-family:var(--mono,monospace);font-weight:700;min-width:44px}
.ccn-res .rb.ccn-old{color:#a05a12;font-weight:600}
.ccn-oldw{margin-top:4px;color:#8a5212;font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ccn-res .rb{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;padding-left:8px}
.cb-sec textarea{width:100%;min-height:92px;resize:vertical;font:inherit;font-size:13.5px;line-height:1.45}
.cb-list{display:grid;gap:0}
.cb-it{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.cb-it:last-child{border-bottom:0}
.cb-it .d{font-family:var(--mono,monospace);font-size:12px;color:var(--muted);min-width:78px;padding-top:1px}
.cb-it .x{flex:1;white-space:pre-wrap;word-break:break-word}
.cb-it .ref{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.cb-it.done .x{color:var(--muted);text-decoration:line-through}
.cb-it .due{font-size:11.5px;font-weight:600;white-space:nowrap}
.cb-it .due.late{color:#c0392b}
.cb-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cb-add input[type=text],.cb-add input:not([type]){flex:1;min-width:200px}
.cb-cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cb-cal label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.cb-cal input{font-size:13px}
.cb-cal label.past{opacity:.6}
.cb-rel{display:flex;gap:6px;flex-wrap:wrap}
.cb-rel button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;color:var(--ink)}
.cb-rel button.on{font-weight:600;border-color:var(--ink-2);background:var(--surface-3)}
.cb-rel button.on[data-v=fluide]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cb-rel button.on[data-v=surveiller]{border-color:#d9822b;background:color-mix(in srgb,#d9822b 14%,var(--surface))}
.cb-rel button.on[data-v=difficile]{border-color:#c0392b;background:color-mix(in srgb,#c0392b 12%,var(--surface))}
.cb-al{display:flex;gap:6px;flex-wrap:wrap}
.cb-hint{font-size:12px;color:var(--muted)}
/* Outils */
.tl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tl-card{padding:14px 16px;display:grid;gap:12px}
.tl-in{display:grid;gap:10px}
.tl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.tl-row .fld{flex:1;min-width:150px}
.tl-eq{font-size:20px;color:var(--muted);padding-bottom:6px}
.tl-opts{display:grid;gap:7px}
.tl-inl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.tl-inl input{width:56px;text-align:center}
.tl-out{border-top:1px dashed var(--line-2);padding-top:12px;display:grid;gap:6px}
.tl-big{font-size:22px;font-weight:650;color:var(--accent);line-height:1.25}
.tl-res{display:grid;gap:3px;font-size:13.5px;color:var(--ink-2)}
.tl-empty{font-size:13px;color:var(--muted)}
.tl-note{font-size:12px;color:var(--muted);line-height:1.45}
.tl-steps{list-style:none;margin:0;padding:0;display:grid;gap:0;border-left:2px solid var(--line-2);margin-left:6px}
.tl-steps li{display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(170px,1fr);gap:2px 12px;padding:7px 0 7px 16px;position:relative;font-size:13.5px}
.tl-steps li::before{content:'';position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.tl-steps li.key::before{background:var(--accent);border-color:var(--accent)}
.tl-steps li.key .tl-dt{font-weight:650;color:var(--ink)}
.tl-lb{color:var(--ink-2)}
.tl-dt{color:var(--ink)}
.tl-sb{grid-column:1 / -1;font-size:12px;color:var(--muted)}
.tl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.tl-grid div{background:var(--surface-2);border-radius:9px;padding:9px 11px;display:grid;gap:2px}
.tl-grid span{font-size:12px;color:var(--muted)}
.tl-grid b{font-size:20px}
.tl-pals{display:grid;gap:6px}
.tl-pal{display:flex;align-items:center;gap:7px;font-size:13px;flex-wrap:wrap}
.tl-pal input{width:60px;text-align:center}
.tl-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tl-ident summary{cursor:pointer;font-size:13px;color:var(--ink-2)}.tl-ident[open] summary{margin-bottom:6px}
.th-sws{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.th-sw{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);padding:0}.th-sw.on{box-shadow:0 0 0 2px var(--ink)}
.cc-list{display:grid;gap:4px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.liss-sw{margin:8px 0;padding:6px 10px;background:var(--accent-soft);border-radius:8px}.liss-row td{font-style:italic;color:var(--ink-2)}
.tl-acts{display:flex;justify-content:flex-end;gap:6px;border-top:1px dashed var(--line);padding-top:8px;margin-top:-4px}
.aev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.aev-in{display:flex;gap:4px}.aev-in input{flex:1 1 auto;min-width:0;width:auto}.aev-in select{flex:0 0 96px;width:96px;min-width:0}
.aev-best{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}.aev-tag{color:var(--accent);font-weight:600}
.tl-m{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.tl-mh{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
@media (max-width:900px){.tl-two{grid-template-columns:1fr}}
.tl-month{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-month .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tl-opt-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.imp-groups{display:grid;gap:4px}.imp-g{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:4px 8px;background:var(--surface-2);border-radius:8px}
.imp-tbl{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px}.imp-tbl table{width:100%}.imp-tbl tr.off td{opacity:.5}
.imp-st{font-size:12px;font-weight:600;padding:1px 6px;border-radius:6px}.imp-st.new{background:#e3f1e6;color:#25663a}.imp-st.ex{background:#e6eef8;color:#2f5f96}.imp-st.dup{background:#fbeedd;color:#8a5212}
.rz-keep{background:var(--surface-2);border-radius:8px;padding:8px 10px;color:var(--ink-2)}
.rz-step{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.tl-pick{align-items:flex-start;white-space:normal;font-size:13.5px;color:var(--ink);padding:6px 4px}
.tl-card{min-width:0;overflow:hidden}
.tl-card input,.tl-card select{min-width:0;max-width:100%;box-sizing:border-box}
.tl-row .fld input,.tl-row .fld select{width:100%}
.tl-card .chk{white-space:normal;align-items:flex-start}
.tl-card .seg{flex-wrap:wrap}
@media (max-width:700px){.tl-steps li{grid-template-columns:1fr}.tl-row .fld{min-width:100%}.tl-card .seg button{flex:1 1 45%}}
.sch .seg{flex-wrap:wrap}
.sch-grid{display:grid;gap:0;padding:4px 14px}
.sch-row{display:grid;grid-template-columns:92px 1fr 64px;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.sch-row:last-child{border-bottom:0}
.sch-row.off .sch-d{color:var(--muted)}
.sch-d{font-weight:600;font-size:13px}
.sch-rs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sch-r{display:inline-flex;align-items:center;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px 3px 2px 6px}
.sch-r.bad{border-color:#c0392b}
.sch-r input{width:54px;text-align:center;font-family:var(--mono,monospace);font-size:13px;padding:3px 2px;border:0;background:transparent}
.sch-gap{font-size:11.5px;color:var(--muted)}
.sch-t{text-align:right;font-size:12.5px;color:var(--ink-2)}
.sch-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line)}
.sch-hint{font-size:12px;color:var(--muted);padding:8px 14px}
.sch-days{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:700px){.sch-row{grid-template-columns:1fr;gap:4px}.sch-t{text-align:left}}
.cb-ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 8px;padding:6px 8px 6px 4px;border-bottom:2px solid color-mix(in srgb,var(--g,var(--line-2)) 45%,var(--surface))}
.cb-ghead:first-of-type{margin-top:0}
.cb-gfold{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap;border-radius:6px}
.cb-gfold:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cb-gfold .car{display:inline-flex;width:15px;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
.cb-ghead.folded .car{transform:none}
.cb-gs{font-size:12.5px;color:var(--ink-2)}
.cb-gs .late{color:#c0392b;font-weight:600}
.cb-gtiles .cb-tile{border-left:3px solid var(--g,var(--line))}
.cb-gnote{border-left:3px solid var(--g,var(--line))}
.cb-gtext{white-space:pre-wrap;font-size:13.5px;line-height:1.45}
.cb-saved{font-size:11.5px;color:var(--accent);opacity:0;transition:opacity .3s}
.cb-saved.on{opacity:1}
@media (max-width:700px){.cb-kv{grid-template-columns:1fr}.cb-kv dt{margin-top:4px}.cb-head h1{font-size:18px}}
/* Blocs déplaçables et repliables */
.blk-wrap{display:flex;flex-wrap:wrap;column-gap:16px;align-items:flex-start}
.blk-wrap>*{width:100%;min-width:0}
.blk-wrap>.blk.half{width:calc(50% - 8px)}
.blk-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:28px 0 10px;position:relative}
.blk-h h2{margin:0}
.blk-wrap>.blk.blk-first>.blk-h{margin-top:16px}
.blk-t{cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none;border-radius:4px}
.blk-t:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.blk-car{display:inline-flex;width:13px;height:13px;transform:rotate(90deg);transition:transform .15s}
.blk-car svg{width:13px;height:13px}
.blk.fold .blk-car{transform:none}
.blk.fold>:not(.blk-h){display:none!important}
.blk.fold>.blk-h{margin-bottom:0}
.blk-m{margin-left:auto;color:var(--muted);font-size:16px;line-height:1;padding:2px 7px;opacity:.6}
.blk-h:hover .blk-m,.blk-m:focus-visible,.blk-m.on{opacity:1}
.blk-grip{position:absolute;left:-19px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:grab;color:var(--muted);padding:2px;font-size:14px;line-height:1;opacity:0;touch-action:none}
.blk-h:hover .blk-grip{opacity:.8}
@media (hover:none){.blk-grip{display:none}}
.blk.dragging{opacity:.4}
.blk.drop-before{box-shadow:0 -3px 0 var(--accent)}
.blk.drop-after{box-shadow:0 3px 0 var(--accent)}
.blk-wrap.is-dragging{user-select:none}
.blk-menu{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:5px;min-width:230px}
.blk-menu .bm-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:5px 9px 4px}
.blk-menu button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink)}
.blk-menu button:hover,.blk-menu button:focus-visible{background:var(--accent-soft)}
.blk-menu button[disabled]{opacity:.38;cursor:default;background:none}
.blk-menu .bm-i{width:16px;text-align:center;color:var(--ink-2)}
.blk-menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
@media (max-width:900px){.blk-wrap>.blk.half{width:100%}}
.toolbar .sp{flex:1}

/* billing */
.bclient{margin-top:10px;overflow:hidden}
.bclient-h{display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap}
.bclient-h .name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer;border:0;background:transparent;padding:0}
.bclient-h .meta{color:var(--muted);font-size:12px}
.bclient-h .amt{margin-left:auto;font-family:var(--mono);font-size:18px;font-weight:600}
.bclient-body{border-top:1px solid var(--line)}

/* refs */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.ref-add{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--line)}
.ref-add input{flex:1}
.ref-row{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line)}
.ref-row:last-child{border-bottom:0}
.ref-row input.nm{flex:1;min-width:80px;border-color:transparent;background:transparent;font-weight:500}
.ref-row input.nm:hover{border-color:var(--line)}
.ref-row input.code{width:90px;border-color:transparent;background:transparent;font-family:var(--mono);font-size:12px}
.ref-row input.code:hover{border-color:var(--line)}
.ref-row select{padding:4px 6px;font-size:12px}
.ref-row .use{font-size:12px;color:var(--muted);font-family:var(--mono);width:62px;text-align:right}
.ref-row.arch{opacity:.55}
.trash-list{max-height:320px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--surface-2);border-radius:5px;padding:2px 6px;width:52px;text-align:center;flex:none}
.ref-list{max-height:520px;overflow:auto}
.settings{padding:14px;display:grid;gap:14px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px}
.setting .d{font-size:12px;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,15,10,.42);z-index:100;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto}
.modal.wide{width:min(900px,100%)}
.modal-h{display:flex;align-items:center;padding:16px 18px 6px;gap:10px}
.modal-h h3{margin:0;font-size:17px}
.modal-h .icon{margin-left:auto}
.modal-b{padding:8px 18px 14px;display:grid;gap:12px}
.modal-f{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line);align-items:center}
.modal-f .sp{flex:1}
.fld{display:grid;gap:4px}
.fld>span{font-size:12px;color:var(--muted);font-weight:500}
.fld-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.radio{display:flex;gap:6px}
.radio label{flex:1;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;cursor:pointer}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* toast */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:200}
.toast{background:var(--ink);color:var(--bg);border-radius:9px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px}
.toast button{border:0;background:transparent;color:var(--accent-2);font-weight:600;padding:0}
/* Groupes de dossiers */
.grp-tag{--g:#888;display:inline-flex;align-items:center;gap:5px;max-width:15em;padding:1px 8px 1px 6px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.55;white-space:nowrap;vertical-align:middle;flex:none;background:color-mix(in srgb,var(--g) 13%,var(--surface));color:color-mix(in srgb,var(--g) 72%,var(--ink));border:1px solid color-mix(in srgb,var(--g) 32%,var(--surface))}
.grp-tag i{width:7px;height:7px;border-radius:50%;background:var(--g);flex:none}
.grp-tag span{overflow:hidden;text-overflow:ellipsis}
.grp-tag.sm{margin-left:6px;font-size:10.5px;max-width:11em}
.grp-tag.lg{font-size:12.5px;padding:2px 10px 2px 8px;max-width:24em}
.opt .grp-tag{max-width:12em}
.grp-dot{--g:#888;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);flex:none;vertical-align:middle;margin-left:2px}
.grp-none{font-weight:600;color:var(--ink-2);font-size:12.5px}
.grp-sws{display:inline-flex;gap:4px;flex-wrap:wrap}
.grp-sw{--g:#888;width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);background:var(--g);box-shadow:0 0 0 1px var(--line-2);padding:0;cursor:pointer}
.grp-sw.on{box-shadow:0 0 0 2px var(--g)}
.grp-pick{--g:transparent;display:inline-flex;border-left:4px solid var(--g);border-radius:4px}
.grp-pick select{max-width:150px}
.cy-table tr.has-grp > td:first-child{box-shadow:inset 3px 0 0 var(--g)}
.cy-table tr.cy-grp td{padding:0;background:var(--surface-2);border-top:1px solid var(--line-2);position:sticky;left:0}
.cy-grp-b{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:7px 10px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.cy-grp-b:hover{background:color-mix(in srgb,var(--g,var(--muted)) 7%,transparent)}
.cy-grp-b .car{display:inline-flex;width:14px;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
.cy-grp.folded .cy-grp-b .car{transform:rotate(0)}
.cy-grp-s{font-size:12px;color:var(--ink-2)}
.cy-grp-s .g-late{color:var(--stop);font-weight:600}
.cy-grp-s .g-al{color:var(--s-todo);font-weight:600}
.dense .cy-grp-b{padding:4px 8px}
/* Absences et journées entières */
.abs-ic{display:inline-flex;width:16px;height:16px;color:#6b5fa8;flex:none}
.abs-ic svg{width:16px;height:16px}
.abs-ic.is-form{color:var(--ink-2)}
.row.allday .abs-half{color:var(--ink-2)}
.row.is-abs{background:color-mix(in srgb,#6b5fa8 5%,var(--surface))}
.abs-chip{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,#6b5fa8 13%,var(--surface));color:color-mix(in srgb,#6b5fa8 70%,var(--ink))}
.abs-chip.is-form,.abs-chip.hol{background:var(--surface-3);color:var(--ink-2)}
.abs-types{display:flex;flex-wrap:wrap;gap:6px}
.abs-t{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.abs-t.on{background:color-mix(in srgb,#6b5fa8 16%,var(--surface));border-color:#6b5fa8;font-weight:600}
.abs-t.is-form.on{background:var(--accent-soft);border-color:var(--accent)}
.ab-sum{padding:10px 12px;border-radius:8px;background:var(--surface-2);display:grid;gap:4px}
.abs-upc{padding:4px 0}
.hol-sugg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin:12px 0;border-left:3px solid #6b5fa8}
.abs-up{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.abs-up:last-child{border-bottom:0}
#tb-abs{color:#6b5fa8}
@media (prefers-color-scheme: dark){ .abs-ic,#tb-abs{color:#a99ce0} .abs-t.on{border-color:#a99ce0} }
@media (prefers-color-scheme: dark){ .toast button{color:var(--accent)} }
@media (prefers-color-scheme: dark){ .cyc-badge{--cyf:color-mix(in srgb,var(--accent) 45%,var(--surface))} }

.loading{display:grid;place-items:center;height:60vh;color:var(--muted)}
.login{max-width:420px;padding:28px;text-align:center;color:var(--ink)}
.login h3{margin:0 0 6px;font-size:19px}
.login h3.brandname{font-family:var(--brand-font);font-weight:600;letter-spacing:var(--brand-ls);font-size:24px;color:var(--accent)}
.login p{color:var(--ink-2);margin:0 0 18px}
.login .err{color:var(--stop);font-size:13px;margin-top:12px}
textarea.copy{width:100%;height:160px;font-family:var(--mono);font-size:12px}

@media (max-width: 980px){
  .row{grid-template-columns:1fr auto;grid-auto-rows:auto}
  .row .lbl{grid-column:1 / -1}
  .tb-fields{grid-template-columns:1fr 1fr}
  .tb-fields #tb-label{grid-column:1 / -1}
  .grid2{grid-template-columns:1fr}
  .top{gap:8px;padding:0 10px}
  .brand .txt{display:none}
  .sync span{display:none}
}
@media (max-width: 700px){
  html,body{font-size:15px}
  input,select,textarea{font-size:16px}
  .top{height:52px;padding:0 12px;gap:8px}
  .top-right{gap:8px}
  #account{padding:4px 8px}
  #install-btn{padding:5px 9px}
  .cyc-badge{position:absolute;top:2px;left:50%;margin-left:6px;width:22px;height:22px}
  .cyc-badge .cyc-m{font-size:7.5px}
  .nav a{position:relative}
  .nav{position:fixed;left:0;right:0;bottom:0;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);z-index:60;justify-content:space-around;gap:0;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .nav a{flex:1;flex-direction:column;justify-content:center;gap:3px;font-size:10.5px;min-width:0;padding:0 2px;border-bottom:0;border-top:2px solid transparent;margin:0;position:relative;text-align:center;line-height:1.1}
  .nav a.on{border-top-color:var(--accent);color:var(--accent)}
  .nav a svg{display:block;width:22px;height:22px;order:0;margin:0;opacity:1}
  .nav a.run::after,.nav a.call::after{top:6px;left:calc(50% + 8px)}
  .nav a .lg{display:none} .nav a .sm{display:inline}
  .nav .count{position:absolute;top:5px;left:calc(50% + 8px);margin:0;font-size:10px;padding:0 5px}
  main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  h2{margin:20px 0 8px}
  .pill{padding:3px 3px 3px 10px;max-width:none}
  .pill .what{display:none}
  /* chrono */
  .timerbar{position:static;flex-direction:column;padding:10px}
  .tb-fields{grid-template-columns:1fr}
  .tb-fields #tb-label{grid-column:auto}
  .tb-fields input{height:48px;font-size:16px}
  .tb-side{padding:10px 0 0;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .tb-side .bill{height:40px;font-size:14px}
  #tb-timer{flex:1;display:flex;justify-content:center}
  .clock{font-size:30px;min-width:0;text-align:center}
  .go{width:66px;height:66px}
  .go svg{width:26px;height:26px}
  .go.add{height:52px}
  .modes{flex-direction:row}
  .modes button{width:34px;height:34px}
  .manual{flex:1 1 100%;order:5;flex-wrap:wrap}
  .manual input[type=date]{flex:1 1 100%}
  .manual input.hm{flex:1}
  .tb-sub{flex-wrap:wrap}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .chip{flex:none;max-width:80vw}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .pf-head #pf-q{min-width:0 !important;flex:1 1 100%}
  .pf-tasks{grid-template-columns:1fr}
  .cy-table td.cy-name{min-width:140px}
  .cy-name .what .cl{max-width:140px}
  .cy-perm{max-width:140px}
  .cy-banner{flex-wrap:wrap}
  .cy-pg-grid{grid-template-columns:1fr}
  .cy-prog-h{flex-wrap:wrap}
  .cy-hist{width:100%;overflow-x:auto}
  .stat{padding:10px 12px}
  .stat .v{font-size:20px}
  .day-h{flex-wrap:wrap;gap:6px 12px;padding:10px 12px}
  .day-h .tb{order:3}
  /* saisies en cartes */
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px}
  .row>.what{flex:1 1 0;min-width:0;order:1;font-size:15px}
  .row>.dur-in,.row>.dur{order:2;width:78px;flex:none;font-size:17px}
  .row>.lbl{order:3;flex:1 1 100%;border-color:var(--line);font-size:15px}
  .row>.bill{order:4}
  .row>label.chk{order:5;font-size:13px}
  .row>.times{order:6}
  .row>.acts{order:7;margin-left:auto}
  .row>.lbl-ro{order:3;flex:1 1 100%}
  .row>span:empty{display:none}
  .row.running>.dur{width:auto}
  .row .what{flex-wrap:wrap;row-gap:1px}
  .row .what .cl,.row .what .tk{white-space:normal;overflow:visible}
  .brand .txt{display:inline}
  #tb-timer{order:0;flex:1 1 100%}
  .tb-side>.bill{order:1}
  .go{order:2;margin-left:auto}
  .modes{order:3}
  .ref-row>.dot,.ref-row>.pf-ic{order:0}
  .ref-row>input.nm{order:1;flex:1 1 calc(100% - 80px)}
  .ref-row>[data-act=del-ref]{order:2}
  .ref-row>input.code{order:3;flex:0 0 90px;border-color:var(--line)}
  .ref-row>select{order:4}
  .ref-row>.use{order:5;width:auto}
  .ref-row>[data-act=toggle-arch]{order:7;margin-left:auto}
  .ref-row>.pf{order:3}
  .ref-row>select[data-k=owner]{order:4;flex:1 1 100%}
  .ref-row>[data-act=to-person]{order:6}
  .ref-add>#new-client,.ref-add>#new-person,.ref-add>#new-task{flex:1 1 100%}
  .trash-list .ref-row>span{flex:1 1 auto}
  .row input[type=checkbox]{width:20px;height:20px}
  .times input{width:58px;font-size:14px;border-color:var(--line)}
  .icon{width:38px;height:38px}
  /* autres vues */
  .filters{padding:10px}
  .filters label{flex:1 1 calc(50% - 8px)}
  .filters select,.filters input{width:100%}
  .toolbar{margin-top:20px}
  .bulk .btn{flex:1 1 auto}
  .bclient-h .amt{margin-left:0}
  .ref-add{flex-wrap:wrap}
  .ref-row{flex-wrap:wrap;padding:10px 12px}
  .ref-list{max-height:none}
  .setting{flex-wrap:wrap}
  /* modales en panneau du bas */
  .overlay{padding:0;place-items:end stretch}
  .modal,.modal.wide{width:100%;border-radius:16px 16px 0 0;max-height:92vh}
  .modal-f{flex-wrap:wrap;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .modal-f .btn{flex:1 1 auto;justify-content:center}
  .combo-list{max-width:calc(100vw - 44px)}
  .toasts{bottom:calc(74px + env(safe-area-inset-bottom));width:calc(100% - 24px)}
  .toast{justify-content:space-between}
  .login{margin:0 8px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg></div><span class="txt">Antevorta</span></div>
  <nav class="nav">
    <a href="#chrono" data-view="chrono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg><span class="lg">Ma journée</span><span class="sm">Journée</span></a>
    <a href="#portefeuille" data-view="portefeuille"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg><span class="lg">Mon cycle</span><span class="sm">Cycle</span><span class="cyc-badge" id="cyc-badge" hidden><span class="cyc-m"></span></span></a>
    <a href="#carnet" data-view="carnet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7M9 11h5"/></svg><span class="lg">Carnet de bord</span><span class="sm">Carnet</span></a>
    <a href="#rapports" data-view="rapports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Rapports</span></a>
    <a href="#facturation" data-view="facturation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h5"/></svg><span>À facturer</span><span class="count" id="todo-count" hidden></span></a>
    <a href="#referentiel" data-view="referentiel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21v-1a6 6 0 0 1 12 0v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM17 11h4M19 9v4"/></svg><span class="lg">Références</span><span class="sm">Réf.</span></a>
    <a href="#outils" data-view="outils"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg><span class="lg">Outils</span><span class="sm">Outils</span></a>
    <a href="#reglages" data-view="reglages" id="nav-reglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="lg">Réglages</span><span class="sm">Réglages</span><span class="count" id="acc-count" hidden></span></a>
  </nav>
  <div class="top-right">
    <div id="pill" class="pill" hidden></div>
    <button id="cmd-btn" class="icon hist-btn" title="Rechercher et agir (Ctrl+K) : dossier, onglet, outil, saisie rapide" aria-label="Rechercher et agir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button id="call-btn" class="icon hist-btn call-btn" title="Appel ou interruption : met le chrono en pause et lance un chrono d’appel" aria-label="Appel ou interruption"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span class="call-t mono"></span></button>
    <button id="hist-btn" class="icon hist-btn" title="Historique : vos 10 dernières actions, restaurables en un clic" aria-label="Historique des actions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
    <div id="sync" class="sync"><i></i><span>Chargement…</span></div>
    <button id="install-btn" class="btn sm primary" hidden title="Installer Antevorta sur cet appareil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Installer</button>
    <button id="account" class="btn sm ghost" hidden>Déconnexion</button>
    <span class="ver" id="ver"></span>
  </div>
</header>

<main>
  <div id="loading" class="loading">Chargement de vos temps…</div>

  <!-- ===== CHRONO ===== -->
  <section class="view" id="v-chrono">
    <div class="card timerbar" id="timerbar">
      <div class="tb-fields">
        <div class="combo" id="cb-client"><input placeholder="Client, dossier ou personne" autocomplete="off" spellcheck="false"></div>
        <div class="combo" id="cb-task"><input placeholder="Tâche" autocomplete="off" spellcheck="false"></div>
        <input id="tb-label" placeholder="Libellé (ex. bulletins d'octobre, STC M. Durand…)" autocomplete="off">
      </div>
      <div class="tb-side">
        <button id="tb-bill" class="bill" title="Cliquer pour basculer">À facturer</button>
        <div id="tb-timer"><button id="tb-clock" class="clock idle" title="Modifier l'heure de début">00:00:00</button></div>
        <div id="tb-manual" class="manual" hidden>
          <input type="date" id="mn-date">
          <input class="hm" id="mn-start" title="Heure de début" placeholder="début" inputmode="numeric" autocomplete="off">

function importFile(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let d; try { d = JSON.parse(rd.result); } catch (e) { toast('Fichier illisible'); return; }
    if (!d || !d.meta || !d.days) { toast('Ce fichier n’est pas une sauvegarde Antevorta'); return; }
    const m = normalizeMeta(d.meta);
    const remap = {}; let nc = 0, nt = 0, ncode = 0;
    const mergeArr = (arr, items, isClient) => {
      for (const x of items) {
        if (!x || !x.id || !x.name) continue;
        if (arr.some(y => y.id === x.id)) continue;
        const same = arr.find(y => norm(y.name) === norm(x.name));
        if (same) { remap[x.id] = same.id; if (isClient && !same.code && x.code) { same.code = x.code; ncode++; } if (isClient && x.cy && !same.cy) same.cy = x.cy; if (isClient && x.alerts && !same.alerts) same.alerts = x.alerts; if (isClient && x.cb && !same.cb) same.cb = x.cb; if (isClient && x.group && !same.group) same.group = x.group; continue; }
        arr.push({ ...x }); isClient ? nc++ : nt++;
      }
    };
    mergeArr(S.meta.groups, m.groups, false);
    mergeArr(S.meta.clients, m.clients, true); mergeArr(S.meta.tasks, m.tasks, false); mergeArr(S.meta.persons, m.persons, false);
    S.meta.clients.forEach(c => { if (c.group && remap[c.group]) c.group = remap[c.group]; });
    S.meta.clients.forEach(c => { if (c.owner && remap[c.owner]) c.owner = remap[c.owner]; });
    const R = id => remap[id] || id;
    for (const f of m.favorites) { const g = { c: R(f.c), t: R(f.t) }; if (!S.meta.favorites.some(x => x.c === g.c && x.t === g.t)) S.meta.favorites.push(g); }
    let n = 0;
    for (const k in d.days) {
      const en = d.days[k]?.entries || {};
      for (const id in en) {
        const e = en[id]; if (!e || typeof e.start !== 'number') continue;
        const dk = dayKey(e.start); (S.days[dk] ||= { entries: {} });
        if (!S.days[dk].entries[id]) { S.days[dk].entries[id] = { ...e, client: e.client ? R(e.client) : null, task: e.task ? R(e.task) : null }; n++; Store.put('d-' + dk); }
      }
    }
    for (const mk in (d.cycles || {})) {
      const rows = d.cycles[mk]?.rows || {}; let ch = false;
      for (const cid in rows) { const id = R(cid); const doc = (S.cycles[mk] ||= { rows: {} }); if (!doc.rows[id]) { doc.rows[id] = rows[cid]; ch = true; } }
      if (d.cycles[mk]?.closed && S.cycles[mk] && !S.cycles[mk].closed) { S.cycles[mk].closed = d.cycles[mk].closed; ch = true; }
      if (ch) Store.put('cy-' + mk);
    }
    S.rev++; Store.put('meta'); scheduleRender(); syncTimerBar();
    const parts = [];
    if (nc) parts.push(nc + ' client' + (nc > 1 ? 's' : ''));
    if (nt) parts.push(nt + ' tâche' + (nt > 1 ? 's' : ''));
    if (n) parts.push(n + ' saisie' + (n > 1 ? 's' : ''));
    toast((parts.length ? 'Importé : ' + parts.join(', ') : 'Rien de nouveau à importer') + (ncode ? ' · ' + ncode + ' numéro' + (ncode > 1 ? 's' : '') + ' de dossier complété' + (ncode > 1 ? 's' : '') : '') + '. Les doublons sont ignorés.');
  };
  rd.readAsText(file);
}

/* ---------- Contrôle d'accès (Firebase) ----------
   Collection access/{uid} : { email, name, status: pending|approved|refused, requestedAt, decidedAt }
   L'administrateur est défini dans les règles Firestore (son adresse e-mail) : l'application
   le reconnaît simplement au fait qu'il a le droit de lister la collection access. */
const Access = {
  list: [], first: true,
  async check(F, db, user) {
    try { await F.getDocs(F.query(F.collection(db, 'access'), F.limit(1))); return 'admin'; }
    catch (e) { if (e && e.code !== 'permission-denied') console.warn(e); }
    const ref = F.doc(db, 'access', user.uid);
    let snap;
    try { snap = await F.getDoc(ref); }
    catch (e) { if (e && e.code === 'permission-denied') return 'legacy'; throw e; } // anciennes règles : pas de validation
    const st = snap.exists() ? snap.data().status : null;
    if (st === 'approved') { this.watchSelf(F, ref); return 'approved'; }
    if (!snap.exists()) {
      try { await F.setDoc(ref, { email: user.email || '', name: user.displayName || '', status: 'pending', requestedAt: Date.now() }); }
      catch (e) { console.warn(e); }
    }
    return new Promise(resolve => {
      const un = F.onSnapshot(ref, d => {
        const s2 = d.exists() ? d.data().status : null;
        if (s2 === 'approved') { un(); $('#loading').innerHTML = '<div class="loading">Accès validé, chargement…</div>'; this.watchSelf(F, ref); resolve('approved'); }
        else showAccessScreen(s2 === 'refused' ? 'refused' : 'pending', user);
      }, () => showAccessScreen('pending', user));
    });
  },
  watchSelf(F, ref) {
    F.onSnapshot(ref, d => {
      if (!d.exists() || d.data().status !== 'approved') {
        document.body.insertAdjacentHTML('beforeend', `<div class="overlay"><div class="modal"><div class="modal-h"><h3>Accès retiré</h3></div><div class="modal-b">Votre accès à Antevorta a été retiré par l’administrateur.</div><div class="modal-f"><span class="sp"></span><button class="btn primary" onclick="location.reload()">OK</button></div></div></div>`);
      }

  },
  startAdmin() {
    const { F, db } = Store.fb;
    F.onSnapshot(F.collection(db, 'access'), snap => {
      const fresh = [];
      if (!this.first) for (const ch of snap.docChanges()) if (ch.type === 'added' && ch.doc.data().status === 'pending') fresh.push(ch.doc.data());
      this.list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const pending = this.list.filter(x => x.status === 'pending');
      if (this.first && pending.length) toast(pending.length + ' demande' + (pending.length > 1 ? 's' : '') + ' d’accès en attente', 'Voir', () => goAccess());
      for (const x of fresh) this.alert(x);
      this.first = false;
      const c = $('#acc-count'); c.hidden = !pending.length; c.textContent = pending.length;
      if (UI.view === 'reglages') this.render();
    }, e => console.warn(e));
  },
  alert(x) {
    toast('Nouvelle demande d’accès : ' + (x.email || x.name), 'Voir', () => goAccess());
    try { if (window.Notification && Notification.permission === 'granted') { const n = new Notification('Antevorta : nouvelle demande d’accès', { body: (x.name ? x.name + ' — ' : '') + (x.email || '') }); n.onclick = () => { window.focus(); goAccess(); }; } } catch (e) {}
    const t0 = document.title; let k = 0; const iv = setInterval(() => { document.title = (k++ % 2) ? t0 : '🔔 Demande d’accès'; if (k > 12) { clearInterval(iv); document.title = t0; } }, 1000);
  },
  async set(id, status) {
    const { F, db } = Store.fb;
    try { await F.updateDoc(F.doc(db, 'access', id), { status, decidedAt: Date.now() }); }
    catch (e) { toast('Action impossible (' + (e.code || e) + ')'); }
  },
  async remove(id) {
    const { F, db } = Store.fb;
    try { await F.deleteDoc(F.doc(db, 'access', id)); } catch (e) { toast('Action impossible (' + (e.code || e) + ')'); }
  },
  render() {
    const body = $('#acces-body'); if (!body) return;
    const by = st => this.list.filter(x => x.status === st).sort((a, b) => (b.requestedAt || 0) - (a.requestedAt || 0));
    const notif = window.Notification ? Notification.permission : 'unsupported';
    const row = (x, acts) => `<div class="ref-row" data-id="${esc(x.id)}"><span style="flex:1"><b>${esc(x.name || '—')}</b> <span class="muted">${esc(x.email || '')}</span></span>
      <span class="muted small">${x.status === 'pending' ? 'demandé le ' + fmtDate(x.requestedAt || 0) + ' à ' + hhmm(x.requestedAt || 0) : x.decidedAt ? 'le ' + fmtDate(x.decidedAt) : ''}</span>${acts}</div>`;
    const sect = (title, arr, acts, empty) => `<h2>${title} (${arr.length})</h2><div class="card">${arr.map(x => row(x, acts)).join('') || `<div class="empty" style="padding:18px">${empty}</div>`}</div>`;
    body.innerHTML = `<div class="card filters"><div style="flex:1"><div style="font-weight:600;font-size:15px">Accès à Antevorta (administrateur)</div><div class="muted small">Toute personne qui se connecte avec Google apparaît ici « en attente ». Elle ne voit rien et n’enregistre rien tant que vous ne l’avez pas validée. Chaque compte n’accède qu’à ses propres temps.</div></div>
      ${notif === 'granted' ? '<span class="muted small">🔔 Alertes du navigateur activées</span>' : notif === 'unsupported' ? '' : '<button class="btn sm" data-a="notif">🔔 Activer les alertes du navigateur</button>'}</div>
      ${sect('En attente de validation', by('pending'), '<button class="btn sm primary" data-a="approve">Valider</button><button class="btn sm danger" data-a="refuse">Refuser</button>', 'Aucune demande en attente.')}
      ${sect('Comptes autorisés', by('approved'), '<button class="btn sm danger" data-a="refuse">Retirer l’accès</button>', 'Aucun autre compte autorisé pour l’instant (vous êtes administrateur).')}
      ${sect('Comptes refusés', by('refused'), '<button class="btn sm" data-a="approve">Autoriser</button><button class="btn sm ghost" data-a="remove" title="La personne pourra refaire une demande">Effacer la demande</button>', 'Aucun compte refusé.')}`;
    if (!body._bound) {
      body._bound = true;
      body.addEventListener('click', async ev => {
        const b = ev.target.closest('[data-a]'); if (!b) return;
        if (b.dataset.a === 'notif') { try { await Notification.requestPermission(); } catch (e) {} this.render(); return; }
        const id = b.closest('[data-id]')?.dataset.id; if (!id) return;
        if (b.dataset.a === 'approve') this.set(id, 'approved');
        else if (b.dataset.a === 'refuse') this.set(id, 'refused');
        else if (b.dataset.a === 'remove') this.remove(id);
      });
    }
  },
};
function showAccessScreen(kind, user) {

/* ---------- Connexion Firebase ---------- */
function showFatal(msg) { const l = $('#loading'); if (l) l.innerHTML = `<div class="card login"><h3>Chargement impossible</h3><p>${esc(msg)}</p></div>`; }
function showLogin(auth, AU) {
  return new Promise(resolve => {
    const l = $('#loading');
    l.innerHTML = `<div class="card login"><div class="brand-mark" style="margin:0 auto 14px;width:40px;height:40px;border-radius:10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg></div>
      <h3 class="brandname">Antevorta</h3><p>Connectez-vous avec votre compte Google pour retrouver vos temps sur n’importe quel poste.</p>
      <button class="btn primary" id="login-btn" style="padding:10px 18px">Se connecter avec Google</button><div class="err" id="login-err"></div></div>`;
    const done = AU.onAuthStateChanged(auth, u => { if (u) { done(); resolve(u); } });
    $('#login-btn').onclick = async () => {
      $('#login-err').textContent = '';
      const prov = new AU.GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
      try { await AU.signInWithPopup(auth, prov); }
      catch (e) {
        const c = e && e.code;
        if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') { try { await AU.signInWithRedirect(auth, prov); } catch (e2) { $('#login-err').textContent = e2.code || String(e2); } }
        else if (c === 'auth/unauthorized-domain') $('#login-err').textContent = 'Ce site (' + location.hostname + ') n’est pas autorisé : ajoutez-le dans Firebase › Authentication › Paramètres › Domaines autorisés.';
        else if (c === 'auth/configuration-not-found' || c === 'auth/operation-not-allowed') $('#login-err').textContent = 'La connexion Google n’est pas activée dans Firebase › Authentication › Mode de connexion.';
        else if (c !== 'auth/popup-closed-by-user' && c !== 'auth/cancelled-popup-request') $('#login-err').textContent = 'Erreur : ' + (c || e);
      }
    };
  });
}

/* ---------- Installation (PWA) ---------- */
const Install = {
  evt: null,
  standalone: () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true,
  refresh() { const b = $('#install-btn'); if (b) b.hidden = !this.evt || this.standalone(); if (UI.view === 'reglages') renderSettings(); },
  async run() {
    if (!this.evt) { openInstallHelp(); return; }
    this.evt.prompt();
    try { const r = await this.evt.userChoice; if (r && r.outcome === 'accepted') toast('Antevorta est en cours d’installation'); } catch (e) {}
    this.evt = null; this.refresh();
  },
};
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); Install.evt = e; Install.refresh(); });
window.addEventListener('appinstalled', () => { Install.evt = null; Install.refresh(); toast('Antevorta est installé : retrouvez son icône sur l’écran d’accueil'); });
function openInstallHelp() {

/* ---------- Toasts ---------- */
function toast(msg, actLabel, act) {
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button>${esc(actLabel)}</button>` : ''}`;
  $('#toasts').appendChild(t);
  if (actLabel) t.querySelector('button').onclick = () => { act(); t.remove(); };
  setTimeout(() => t.remove(), actLabel ? 7000 : 3500);
}

const quoteOn = () => lsGet('quote', '0') === '1'; // désactivé par défaut, à activer dans les réglages
// Citation affichée une fois, en défilement dans le bandeau du haut, à l'ouverture
function showQuote(force = false, custom = null) {
  if (!force && (!quoteOn() || navigator.webdriver)) return;
  document.getElementById('quote-tick')?.remove(); document.getElementById('quote-card')?.remove();
  const [q, a] = custom || QUOTES[Math.floor(Math.random() * QUOTES.length)];
  // Téléphone : carte dans la moitié inférieure de l'écran (le bandeau du haut y est trop étroit)
  if (window.matchMedia && matchMedia('(max-width: 700px)').matches) {
    const el = document.createElement('div'); el.id = 'quote-card'; el.setAttribute('role', 'status');
    el.innerHTML = `<div class="qc-in"><div class="qc-brand">Antevorta</div><blockquote>« ${esc(q)} »</blockquote><div class="qc-auth">— ${esc(a)}</div><div class="qc-bar"><i></i></div><div class="qc-hint">Touchez pour fermer</div></div>`;
    document.body.appendChild(el);
    let gone = false;
    const close = () => { if (gone) return; gone = true; el.classList.add('out'); setTimeout(() => el.remove(), 400); };
    el.addEventListener('click', close);
    setTimeout(close, 7000);
    return;
  }
  const top = document.querySelector('header.top'), right = top && top.querySelector('.top-right'); if (!right) return;
  const el = document.createElement('div'); el.id = 'quote-tick'; el.title = 'Cliquer pour masquer';
  el.innerHTML = `<span class="qt-in"><span class="qt-q">« ${esc(q)} »</span><span class="qt-a">— ${esc(a)}</span></span>`;
  top.insertBefore(el, right);
  const inner = el.firstElementChild;
  let gone = false;
  const close = () => { if (gone) return; gone = true; el.classList.add('out'); setTimeout(() => el.remove(), 400); };
  el.addEventListener('click', close);
  requestAnimationFrame(() => {
    const w = el.clientWidth, tw = inner.scrollWidth;
    if (w < 80) { el.remove(); return; }
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !inner.animate) { inner.style.transform = 'none'; setTimeout(close, 9000); return; }
    const speed = 70; // pixels par seconde
    const anim = inner.animate([{ transform: `translateX(${w}px)` }, { transform: `translateX(${-tw}px)` }], { duration: (w + tw) / speed * 1000, easing: 'linear' });
    anim.onfinish = close;
    el.addEventListener('mouseenter', () => anim.pause()); el.addEventListener('mouseleave', () => anim.play());
  });
}

function lawSituation() {
  if (!S.running) return null;
  const now = Date.now(), k = dayKey(now), st = S.meta.settings;
  const ab = dayAllday(k).find(e => isAbs(e) && e.allday === 'j');
  if (ab) return ab.abs === 'mal' ? 'mal' : 'cp';
  const hol = holidayOn(k), wd = new Date(now).getDay();
  if (hol) return k.slice(5) === '05-01' ? 'mai' : 'fer';
  if (wd === 0) return lawSeen('we', k) ? 'dim' : 'we';
  if (wd === 6) return 'we';
  const worked = from => allEntries().filter(e => e.start >= from).reduce((a, e) => a + dur(e), 0) + (S.running.start >= from ? now - S.running.start : 0);
  const sc = schedOf(now);
  if (!sc.work && sc.mode !== 'none') return 'off';
  if (sc.mode !== 'forfait') { // au forfait jours, les durées maximales de 10 h et 48 h ne s'appliquent pas
    if (worked(startOfWeek(now)) > 48 * 3600000) return 'sem';
    if (worked(startOfDay(now)) > 10 * 3600000) return 'jour';
  }
  const hm = hhmm(now);
  if (sc.end && hm >= sc.end) return 'soir';
  if (sc.start && hm < sc.start) return 'matin';
  return null;
}
const lawSeen = (sit, k) => { try { const o = JSON.parse(lsGet('lawShown', '{}')); return o.d === k && (o.s || []).includes(sit); } catch (e) { return false; } };
function checkLaw() {
  if (!quoteOn() || navigator.webdriver) return;

  let o; try { o = JSON.parse(lsGet('lawShown', '{}')); } catch (e) { o = {}; }
  if (o.d !== k) o = { d: k, s: [] };
  o.s.push(sit); lsSet('lawShown', JSON.stringify(o));
  const arr = LAW[sit]; const [q, a] = arr[Math.floor(Math.random() * arr.length)];
  showQuote(true, [q, (/art\./.test(a) ? '⚖️ ' : '') + a]);
}

const IDLE_MS = 15 * 60 * 1000;
const Idle = { last: Date.now(), shown: 0 };
function initIdleQuote() {
  const act = () => { Idle.last = Date.now(); };
  ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(t => window.addEventListener(t, act, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) act(); });
  setInterval(() => {
    const now = Date.now();
    if (document.hidden || S.running || !quoteOn() || navigator.webdriver) return;
    if (now - Idle.last >= IDLE_MS && now - Idle.shown >= IDLE_MS) { Idle.shown = now; showQuote(true); }
  }, 20000);
}
