<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronocab — temps passés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f5f4f0; --surface:#ffffff; --surface-2:#f0eee9; --surface-3:#e8e6e0;
  --line:#e2dfd8; --line-2:#d3cfc6;
  --ink:#17191c; --ink-2:#4f5157; --muted:#878880;
  --accent:#0d6656; --accent-2:#0a5244; --accent-soft:#e1efeb; --accent-ink:#ffffff;
  --stop:#c2362b; --stop-2:#a52c22; --stop-soft:#f9e6e3;
  --s-inv:#2a78d6; --s-todo:#eb6834; --s-nobill:#1baf7a;
  --todo-soft:#fcebe2; --inv-soft:#e3eefb; --nobill-soft:#eceae5;
  --shadow:0 1px 2px rgba(20,20,10,.05), 0 4px 16px rgba(20,20,10,.05);
  --r:10px;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#141513; --surface:#1c1d1b; --surface-2:#232421; --surface-3:#2c2d2a;
    --line:#30312d; --line-2:#3c3d38;
    --ink:#efeee9; --ink-2:#c1c0b7; --muted:#8d8c84;
    --accent:#2fa58c; --accent-2:#3bb99e; --accent-soft:#18332d; --accent-ink:#0b1210;
    --stop:#e0574b; --stop-2:#ea6c60; --stop-soft:#3a1d1a;
    --s-inv:#3987e5; --s-todo:#d95926; --s-nobill:#199e70;
    --todo-soft:#3a2418; --inv-soft:#1a2a3d; --nobill-soft:#2a2b27;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);padding:0;margin:0;vertical-align:middle;box-shadow:none}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 20px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;font-size:15px;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.nav{display:flex;gap:2px;height:100%}
.nav a{display:flex;align-items:center;padding:0 13px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
.nav .count{margin-left:6px;font-size:11px;font-family:var(--mono);background:var(--todo-soft);color:var(--ink);border-radius:20px;padding:1px 7px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.sync{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--accent)} .sync.busy i{background:var(--s-todo)} .sync.err i{background:var(--stop)}
.pill{display:flex;align-items:center;gap:8px;background:var(--stop-soft);border-radius:30px;padding:4px 4px 4px 12px;font-size:13px;max-width:360px}
.pill .what{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .num{font-weight:600}
.pill button{border:0;background:var(--stop);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}

main{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
.view{display:none}.view.on{display:block}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:28px 0 10px}
h2:first-child{margin-top:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:12px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--stop);border-color:color-mix(in srgb,var(--stop) 40%,var(--line-2))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.icon{border:0;background:transparent;width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.icon svg,.btn svg{width:16px;height:16px}

/* ---------- Timer bar ---------- */
.timerbar{display:flex;align-items:stretch;gap:0;padding:8px;position:sticky;top:68px;z-index:20}
.tb-fields{display:grid;grid-template-columns:minmax(150px,1.05fr) minmax(150px,1.1fr) minmax(180px,1.7fr);gap:6px;flex:1;min-width:0}
.tb-fields input{border-color:transparent;background:var(--surface-2);height:44px;font-size:15px}
.tb-fields input:focus{background:var(--surface)}
.tb-side{display:flex;align-items:center;gap:8px;padding-left:10px}
.bill{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:4px 10px 4px 8px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s-todo)}
.bill.no::before{background:var(--s-nobill)}
.bill.inv::before{background:var(--s-inv)}
.bill:hover{background:var(--surface-2)}
.tb-side .bill{height:34px;padding:0 12px 0 10px;font-size:13px}
.clock{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.01em;border:0;background:transparent;padding:0 6px;min-width:128px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.clock.idle{color:var(--muted)}
.go{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;transition:transform .08s}
.go:hover{background:var(--accent-2)} .go:active{transform:scale(.95)}
.go.stop{background:var(--stop)} .go.stop:hover{background:var(--stop-2)}
.go.add{width:auto;border-radius:24px;padding:0 18px;font-weight:600}
.go svg{width:20px;height:20px}
.modes{display:flex;flex-direction:column;gap:2px;margin-left:2px}
.modes button{border:0;background:transparent;color:var(--muted);width:28px;height:23px;border-radius:5px;display:grid;place-items:center}
.modes button.on{color:var(--accent);background:var(--accent-soft)}
.modes svg{width:15px;height:15px}
.manual{display:flex;align-items:center;gap:6px}
.manual input{height:38px}
.manual input.hm{width:76px;font-family:var(--mono);text-align:center}
.tb-sub{display:flex;align-items:center;gap:10px;padding:6px 6px 0;color:var(--muted);font-size:12px;min-height:10px}
.tb-sub input{padding:2px 6px;font-size:12px;width:64px;font-family:var(--mono);text-align:center}
.warn{background:var(--todo-soft);color:var(--ink);padding:8px 12px;border-radius:8px;font-size:13px;margin-top:10px;display:flex;gap:10px;align-items:center}

/* combobox */
.combo{position:relative;min-width:0}
.combo input{width:100%}
.combo-list{position:absolute;left:0;top:calc(100% + 4px);min-width:100%;width:max-content;max-width:420px;max-height:320px;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:50;padding:4px;display:none}
.combo.open .combo-list{display:block}
.opt{padding:7px 9px;border-radius:6px;display:flex;align-items:center;gap:8px;cursor:pointer}
.opt.hi{background:var(--accent-soft)}
.opt .sub{color:var(--muted);font-size:12px;margin-left:auto;padding-left:14px}
.opt.create{color:var(--accent);font-weight:500}
.opt-head{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 9px 3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,#999);flex:none;display:inline-block}

/* recents */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:2px 3px 2px 4px;gap:2px;max-width:340px}
.chip .star{width:24px;height:24px;color:var(--line-2)}
.chip .star.on{color:#d9a400}
.chip .lab{border:0;background:transparent;padding:4px 4px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.chip .lab span{overflow:hidden;text-overflow:ellipsis}
.chip .play{width:26px;height:26px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.chip .play:hover{background:var(--accent);color:var(--accent-ink)}
.chip .play svg{width:12px;height:12px}
.chip .star svg{width:14px;height:14px}

/* summary stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}

/* entries */
.day{margin-top:14px;overflow:hidden}
.day-h{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.day-h .d{font-weight:600}
.day-h .t{margin-left:auto;font-family:var(--mono);font-weight:600}
.day-h .tb{color:var(--muted);font-size:12px}
.row{display:grid;grid-template-columns:minmax(170px,1.6fr) minmax(140px,1.5fr) auto auto auto auto 62px auto;align-items:center;gap:10px;padding:6px 10px 6px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
.what{border:0;background:transparent;text-align:left;padding:4px 0;display:flex;align-items:center;gap:7px;min-width:0}
.what .cl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.what .tk{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.what .none{color:var(--muted);font-style:italic}
.what .sep{color:var(--muted)}
.lbl{border-color:transparent;background:transparent;padding:5px 7px;width:100%}
.lbl:hover{border-color:var(--line)}
.lbl::placeholder{color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap;cursor:pointer;user-select:none}
.chk.dis{opacity:.35;cursor:default}
.times{display:flex;align-items:center;gap:3px;color:var(--muted)}
.times input{border-color:transparent;background:transparent;padding:3px 4px;width:54px;text-align:center;font-family:var(--mono);font-size:13px}
.times input:hover{border-color:var(--line)}
.dur{font-family:var(--mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.acts{display:flex}
.row.running{background:var(--stop-soft)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}
.more{display:flex;justify-content:center;margin-top:16px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px}
.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.filters select,.filters input{padding:6px 8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:13px;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* chart */
.chart-wrap{padding:14px 16px 8px;position:relative}
.chart-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .hit{fill:transparent}
svg.chart .hit:hover{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:8px 10px;font-size:12px;min-width:170px;z-index:5}
.tip .h{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tip .r span{display:flex;align-items:center;gap:6px}
.tip i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* tables */
.tbl-wrap{overflow:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:12px;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t td.n,.t th.n{text-align:right;white-space:nowrap}
.t td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.t tr.grp td{font-weight:600;background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.t tr.sub td:first-child{padding-left:30px;color:var(--ink-2)}
.t tr.tot td{font-weight:700;border-top:2px solid var(--line-2);border-bottom:0}
.t .zero{color:var(--line-2)}
.t td.lab{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s-todo)}
.status.inv::before{background:var(--s-inv)} .status.no::before{background:var(--s-nobill)}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:28px 0 10px}
.toolbar h2{margin:0}
.toolbar .sp{flex:1}

/* billing */
.bclient{margin-top:10px;overflow:hidden}
.bclient-h{display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap}
.bclient-h .name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer;border:0;background:transparent;padding:0}
.bclient-h .meta{color:var(--muted);font-size:12px}
.bclient-h .amt{margin-left:auto;font-family:var(--mono);font-size:18px;font-weight:600}
.bclient-body{border-top:1px solid var(--line)}

/* refs */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.ref-add{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--line)}
.ref-add input{flex:1}
.ref-row{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line)}
.ref-row:last-child{border-bottom:0}
.ref-row input.nm{flex:1;min-width:80px;border-color:transparent;background:transparent;font-weight:500}
.ref-row input.nm:hover{border-color:var(--line)}
.ref-row input.code{width:90px;border-color:transparent;background:transparent;font-family:var(--mono);font-size:12px}
.ref-row input.code:hover{border-color:var(--line)}
.ref-row select{padding:4px 6px;font-size:12px}
.ref-row .use{font-size:12px;color:var(--muted);font-family:var(--mono);width:62px;text-align:right}
.ref-row.arch{opacity:.55}
.ref-list{max-height:520px;overflow:auto}
.settings{padding:14px;display:grid;gap:14px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px}
.setting .d{font-size:12px;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,15,10,.42);z-index:100;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto}
.modal.wide{width:min(900px,100%)}
.modal-h{display:flex;align-items:center;padding:16px 18px 6px;gap:10px}
.modal-h h3{margin:0;font-size:17px}
.modal-h .icon{margin-left:auto}
.modal-b{padding:8px 18px 14px;display:grid;gap:12px}
.modal-f{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line);align-items:center}
.modal-f .sp{flex:1}
.fld{display:grid;gap:4px}
.fld>span{font-size:12px;color:var(--muted);font-weight:500}
.fld-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.radio{display:flex;gap:6px}
.radio label{flex:1;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;cursor:pointer}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* toast */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:200}
.toast{background:var(--ink);color:var(--bg);border-radius:9px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px}
.toast button{border:0;background:transparent;color:var(--accent-2);font-weight:600;padding:0}
@media (prefers-color-scheme: dark){ .toast button{color:var(--accent)} }

.loading{display:grid;place-items:center;height:60vh;color:var(--muted)}
.login{max-width:420px;padding:28px;text-align:center;color:var(--ink)}
.login h3{margin:0 0 6px;font-size:19px}
.login p{color:var(--ink-2);margin:0 0 18px}
.login .err{color:var(--stop);font-size:13px;margin-top:12px}
textarea.copy{width:100%;height:160px;font-family:var(--mono);font-size:12px}

@media (max-width: 980px){
  .row{grid-template-columns:1fr auto;grid-auto-rows:auto}
  .row .lbl{grid-column:1 / -1}
  .tb-fields{grid-template-columns:1fr 1fr}
  .tb-fields #tb-label{grid-column:1 / -1}
  .grid2{grid-template-columns:1fr}
  .top{gap:8px;padding:0 10px}
  .brand .txt{display:none}
  .sync span{display:none}
}
@media (max-width: 700px){
  .timerbar{flex-direction:column}
  .tb-side{padding:8px 0 0;justify-content:flex-end;flex-wrap:wrap}
  .nav a{padding:0 8px}
  .pill .what{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg></div><span class="txt">Chronocab</span></div>
  <nav class="nav">
    <a href="#chrono" data-view="chrono">Chrono</a>
    <a href="#rapports" data-view="rapports">Rapports</a>
    <a href="#facturation" data-view="facturation">À facturer<span class="count" id="todo-count" hidden></span></a>
    <a href="#referentiel" data-view="referentiel">Clients & tâches</a>
  </nav>
  <div class="top-right">
    <div id="pill" class="pill" hidden></div>

/* =========================================================
   Combobox (recherche client / tâche)
   ========================================================= */
function Combo(root, o) {
  const input = root.querySelector('input');
  const list = document.createElement('div'); list.className = 'combo-list'; root.appendChild(list);
  let items = [], hi = 0, value = null, typed = false;
  function build() {
    const q = typed ? input.value.trim() : '';
    items = o.options(q);
    if (q && o.onCreate && !items.some(i => !i.head && norm(i.label) === norm(q))) items.push({ create: true, text: q, label: o.createLabel(q) });
    const sel = items.filter(i => !i.head);
    hi = Math.min(hi, Math.max(0, sel.length - 1));
    let n = -1;
    list.innerHTML = items.length ? items.map(i => {
      if (i.head) return `<div class="opt-head">${esc(i.label)}</div>`;
      n++;
      return `<div class="opt ${i.create ? 'create' : ''} ${n === hi ? 'hi' : ''}" data-n="${n}">${i.dot ? `<span class="dot" style="--c:${i.dot}"></span>` : ''}<span>${esc(i.label)}</span>${i.sub ? `<span class="sub">${esc(i.sub)}</span>` : ''}</div>`;
    }).join('') : `<div class="opt-head">${typed ? 'Aucun résultat' : o.emptyText}</div>`;
    const h = list.querySelector('.opt.hi'); if (h) h.scrollIntoView({ block: 'nearest' });
  }
  function selectable() { return items.filter(i => !i.head); }
  function open() { root.classList.add('open'); build(); }
  function close() { root.classList.remove('open'); typed = false; }
  function choose(it) {
    if (!it) return;
    const id = it.create ? o.onCreate(it.text) : it.id;
    set(id); close(); o.onSelect(id);
  }
  function set(id) { value = id || null; input.value = value ? o.labelOf(value) : ''; }
  input.addEventListener('focus', () => { typed = false; hi = 0; open(); setTimeout(() => { if (!typed) input.select(); }, 0); });
  input.addEventListener('input', () => { typed = true; hi = 0; open(); });
  input.addEventListener('keydown', e => {
    const sel = selectable();
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!root.classList.contains('open')) open(); hi = Math.min(hi + 1, sel.length - 1); build(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); hi = Math.max(hi - 1, 0); build(); }
    else if (e.key === 'Enter') { if (root.classList.contains('open') && sel.length) { e.preventDefault(); choose(sel[hi]); o.onEnter && o.onEnter(); } }
    else if (e.key === 'Escape') { set(value); close(); input.blur(); }
    else if (e.key === 'Tab') { if (typed && sel.length && input.value.trim()) choose(sel[hi]); }
  });
  input.addEventListener('blur', () => setTimeout(() => {
    if (!root.classList.contains('open')) return;
    if (!input.value.trim()) { set(null); close(); o.onSelect(null); }
    else { set(value); close(); }
  }, 120));
  list.addEventListener('mousedown', e => { e.preventDefault(); const el = e.target.closest('.opt[data-n]'); if (el) choose(selectable()[+el.dataset.n]); });
  return { set, get: () => value, focus: () => input.focus(), input };
}
function usageStats() {
  if (usageStats._rev === S.rev) return usageStats._v;
  const cLast = {}, ctCount = {}, tCount = {};
  const since = Date.now() - 120 * DAY;
  for (const e of allEntries()) {
    if (e.client) cLast[e.client] = Math.max(cLast[e.client] || 0, e.start);
    if (e.start < since) continue;
    if (e.task) { tCount[e.task] = (tCount[e.task] || 0) + 1; const k = e.client + '|' + e.task; ctCount[k] = (ctCount[k] || 0) + 1; }
  }
  usageStats._rev = S.rev; usageStats._v = { cLast, ctCount, tCount };
  return usageStats._v;
}
function clientOptions(q) {
  const u = usageStats();
  let cs = S.meta.clients.filter(c => !c.archived);
  if (q) { const n = norm(q); cs = cs.filter(c => norm(c.name).includes(n) || norm(c.code).includes(n)); }
  const recent = q ? [] : cs.filter(c => u.cLast[c.id]).sort((a, b) => u.cLast[b.id] - u.cLast[a.id]).slice(0, 5);
  const rest = cs.slice().sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  const map = c => ({ id: c.id, label: c.name, sub: c.code, dot: colorFor(c.id) });
  if (!recent.length) return rest.map(map);
  return [{ head: true, label: 'Récents' }, ...recent.map(map), { head: true, label: 'Tous les clients' }, ...rest.map(map)];
}
function taskOptions(q, clientId) {
  const u = usageStats();
  let ts = S.meta.tasks.filter(t => !t.archived);
  if (q) { const n = norm(q); ts = ts.filter(t => norm(t.name).includes(n)); }
  const score = t => (clientId ? (u.ctCount[clientId + '|' + t.id] || 0) * 1000 : 0) + (u.tCount[t.id] || 0);
  ts.sort((a, b) => score(b) - score(a) || a.name.localeCompare(b.name, 'fr'));
  const used = clientId && !q ? ts.filter(t => u.ctCount[clientId + '|' + t.id]) : [];
  const map = t => ({ id: t.id, label: t.name, sub: t.billing === 'nobill' ? 'non facturable' : '' });
  if (!used.length) return ts.map(map);
  const rest = ts.filter(t => !used.includes(t)).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  return [{ head: true, label: 'Habituelles pour ce client' }, ...used.map(map), { head: true, label: 'Autres tâches' }, ...rest.map(map)];
}

/* ---------- Vue Chrono ---------- */
function statusOf(e) { return !e.billable ? 'no' : e.invoicedAt ? 'inv' : 'todo'; }
function statusLabel(st) { return st === 'no' ? 'Non facturable' : st === 'inv' ? 'Facturé' : 'À facturer'; }
function whatHTML(c, t) {
  return `<span class="dot" style="--c:${colorFor(c)}"></span>${c ? `<span class="cl">${esc(clientName(c))}</span>` : `<span class="none">Sans client</span>`}${t ? `<span class="sep">›</span><span class="tk">${esc(taskName(t))}</span>` : ''}`;
}
function recents() {
  const seen = new Set(), out = [];
  const favs = S.meta.favorites.filter(f => clientOf(f.c) || taskOf(f.t));
  favs.forEach(f => { seen.add(f.c + '|' + f.t); out.push({ c: f.c, t: f.t, fav: true }); });
  for (const e of allEntries()) {
    if (out.length >= favs.length + 8) break;
    if (!e.client && !e.task) continue;
    const k = e.client + '|' + e.task;
    if (seen.has(k)) continue;
    if (clientOf(e.client)?.archived || taskOf(e.task)?.archived) continue;
    seen.add(k); out.push({ c: e.client, t: e.task, fav: false });
  }
  return out;
}
function renderChrono() {

  const sum = (from, f = () => true) => entries.filter(e => e.start >= from && f(e)).reduce((s, e) => s + dur(e), 0) + (S.running && S.running.start >= from && f(S.running) ? dur(S.running) : 0);

  if (!S.meta.clients.length && !entries.length) {

      <button class="btn" data-act="preset">Ajouter les tâches types de la paie</button> &nbsp; <a class="btn ghost" href="#referentiel">Gérer clients et tâches</a></div>`;

      <button class="icon star ${r.fav ? 'on' : ''}" data-act="fav" title="${r.fav ? 'Retirer des favoris' : 'Épingler en favori'}">${ICON.star}</button>
      <button class="lab" data-act="fill" title="Pré-remplir">${whatHTML(r.c, r.t)}</button>
      <button class="play" data-act="quick" title="Démarrer tout de suite">${ICON.play}</button></div>`).join('') + `</div>`;
  }
  html += `<h2>Résumé</h2><div class="stats">
    <div class="card stat"><div class="k">Aujourd’hui</div><div class="v">${fmtDur(sum(today))}</div></div>
    <div class="card stat"><div class="k">Cette semaine</div><div class="v">${fmtDur(sum(wk))}</div><div class="s">dont ${fmtDur(sum(wk, e => e.billable))} à facturer</div></div>
    <div class="card stat"><div class="k">Ce mois-ci</div><div class="v">${fmtDur(sum(mo))}</div><div class="s">dont ${fmtDur(sum(mo, e => e.billable))} à facturer</div></div>
    <div class="card stat"><div class="k"><span class="dot" style="--c:var(--s-todo)"></span>Reste à facturer</div><div class="v">${todoN}</div><div class="s">saisie${todoN > 1 ? 's' : ''} à facturer · <a href="#facturation">voir le détail</a></div></div>
    <div class="card stat"><div class="k">Non reportées (31 j)</div><div class="v">${unlogged}</div><div class="s">saisies à reporter dans le logiciel du cabinet</div></div>
  </div>`;

function bindEntryEvents(container) {

    else if (f === 'logged') updateEntries([id], e => { e.logged = i.checked; });
    else if (f === 'label') updateEntries([id], e => { e.label = i.value; });
  });

    if (i.dataset.f === 'start') {
      const s = timeOn(day, i.value);
      if (s == null) { i.value = hhmm(e.start); return; }
      if (Math.floor(s / 60000) === Math.floor(e.start / 60000)) { i.value = hhmm(e.start); return; }

      saveEntry({ ...e, start: s, end });

      if (t <= e.start) t += DAY;
      if (Math.floor(t / 60000) === Math.floor(e.end / 60000)) { i.value = hhmm(e.end); return; }

function bindChrono() {

function modal(html, cls = '') {

/* ---------- Récapitulatif à reporter ---------- */
function aggregate(entries) {
  const map = new Map();
  for (const e of entries) {
    const k = (e.client || '') + '|' + (e.task || '') + '|' + (e.billable ? 1 : 0);
    if (!map.has(k)) map.set(k, { client: e.client, task: e.task, billable: e.billable, ms: 0, labels: [], ids: [], logged: true });
    const g = map.get(k); g.ms += dur(e); g.ids.push(e.id); if (!e.logged) g.logged = false;
    if (e.label && !g.labels.includes(e.label.trim())) g.labels.push(e.label.trim());
  }
  return [...map.values()].sort((a, b) => clientName(a.client).localeCompare(clientName(b.client), 'fr') || taskName(a.task).localeCompare(taskName(b.task), 'fr'));
}
function openRecap(k) {

async function copyText(txt, fallbackTa) {

async function downloadText(filename, txt, mime) {

/* ---------- Vue Rapports ---------- */
function periodRange() {
  const r = UI.rep, now = Date.now();
  let from, to;
  switch (r.period) {
    case 'week': from = startOfWeek(now); to = addDays(from, 7); break;
    case 'lastweek': to = startOfWeek(now); from = addDays(to, -7); break;
    case 'month': from = startOfMonth(now); to = addMonths(now, 1); break;
    case 'lastmonth': to = startOfMonth(now); from = addMonths(now, -1); break;
    case 'quarter': { const d = new Date(now); from = new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1).getTime(); to = addMonths(from, 3); break; }
    case 'year': { const y = new Date(now).getFullYear(); from = new Date(y, 0, 1).getTime(); to = new Date(y + 1, 0, 1).getTime(); break; }
    case '12m': to = addMonths(now, 1); from = addMonths(now, -11); break;
    case 'all': { const l = allEntries(); from = l.length ? startOfMonth(l[l.length - 1].start) : startOfMonth(now); to = addMonths(now, 1); break; }
    default: from = r.from ? parseDay(r.from) : startOfMonth(now); to = r.to ? addDays(parseDay(r.to), 1) : addDays(startOfDay(now), 1);
  }
  return [from, to];
}
function filtered() {
  const r = UI.rep, [from, to] = periodRange(), q = norm(r.q);
  return allEntries().filter(e => {
    if (e.start < from || e.start >= to) return false;
    if (r.client && e.client !== r.client) return false;
    if (r.task && e.task !== r.task) return false;
    const st = statusOf(e);
    if (r.bill === 'bill' && !e.billable) return false;
    if (r.bill === 'todo' && st !== 'todo') return false;
    if (r.bill === 'inv' && st !== 'inv') return false;
    if (r.bill === 'no' && st !== 'no') return false;
    if (r.logged === 'yes' && !e.logged) return false;
    if (r.logged === 'no' && e.logged) return false;
    if (q && !(norm(e.label).includes(q) || norm(clientName(e.client)).includes(q) || norm(taskName(e.task)).includes(q))) return false;
    return true;
  });
}
function totals(list) {
  const t = { all: 0, bill: 0, inv: 0, todo: 0, no: 0 };
  for (const e of list) { const d = dur(e), st = statusOf(e); t.all += d; t[st] += d; if (e.billable) t.bill += d; }
  return t;
}

  body.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter') return;
    if (ev.target.id === 'new-client' || ev.target.id === 'new-client-code') addC();
    else if (ev.target.id === 'new-task') addT();
    else if (ev.target.matches('.ref-row input')) ev.target.blur();
  });
  body.addEventListener('click', ev => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, row = b.closest('.ref-row');
    if (act === 'add-client') addC();
    else if (act === 'add-task') addT();
    else if (act === 'preset') addPresetTasks();
    else if (act === 'arch') { UI.refArch = b.checked; renderRefs(); }
    else if (act === 'toggle-arch' && row) { const o = (row.dataset.kind === 'client' ? clientOf : taskOf)(row.dataset.id); o.archived = !o.archived; touchMeta(); }
    else if (act === 'del-ref' && row) { const arr = row.dataset.kind === 'client' ? S.meta.clients : S.meta.tasks; const i = arr.findIndex(x => x.id === row.dataset.id); if (i >= 0) { const [o] = arr.splice(i, 1); touchMeta(); toast('« ' + o.name + ' » supprimé', 'Annuler', () => { arr.push(o); touchMeta(); }); } }
    else if (act === 'export') {
      const data = JSON.stringify({ app: 'chronocab', version: 1, exportedAt: new Date().toISOString(), meta: S.meta, days: S.days, running: S.running }, null, 1);
      downloadText('chronocab_sauvegarde_' + dayKey(Date.now()) + '.json', data, 'application/json');
    }
  });
  body.addEventListener('change', ev => {
    const i = ev.target;
    if (i.id === 'import-file') { importFile(i.files[0]); i.value = ''; return; }
    if (i.dataset.s) { const k = i.dataset.s; S.meta.settings[k] = k === 'roundStep' ? +i.value : k === 'defaultBillable' ? i.value === '1' : i.value; touchMeta(); return; }
    const row = i.closest('.ref-row'); if (!row || !i.dataset.k) return;
    const o = (row.dataset.kind === 'client' ? clientOf : taskOf)(row.dataset.id); if (!o) return;
    const v = i.value.trim(); if (i.dataset.k === 'name' && !v) { i.value = o.name; return; }
    o[i.dataset.k] = v; touchMeta(); syncTimerBar();
  });
}
function importFile(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let d; try { d = JSON.parse(rd.result); } catch (e) { toast('Fichier illisible'); return; }
    if (!d || !d.meta || !d.days) { toast('Ce fichier n’est pas une sauvegarde Chronocab'); return; }
    const m = normalizeMeta(d.meta);
    const mergeArr = (a, b) => { for (const x of b) { const i = a.findIndex(y => y.id === x.id); if (i < 0) a.push(x); } };
    mergeArr(S.meta.clients, m.clients); mergeArr(S.meta.tasks, m.tasks);
    for (const f of m.favorites) if (!S.meta.favorites.some(x => x.c === f.c && x.t === f.t)) S.meta.favorites.push(f);
    let n = 0;
    for (const k in d.days) {
      const en = d.days[k]?.entries || {}; let ch = false;
      for (const id in en) { const e = en[id]; if (!e || typeof e.start !== 'number') continue; const dk = dayKey(e.start); (S.days[dk] ||= { entries: {} }); if (!S.days[dk].entries[id]) { S.days[dk].entries[id] = e; n++; ch = true; Store.put('d-' + dk); } }
    }
    S.rev++; Store.put('meta'); scheduleRender(); syncTimerBar();
    toast(n + ' saisie' + (n > 1 ? 's' : '') + ' importée' + (n > 1 ? 's' : '') + ' (les doublons sont ignorés)');
  };
  rd.readAsText(file);
}

/* ---------- Connexion Firebase ---------- */
function showFatal(msg) { const l = $('#loading'); if (l) l.innerHTML = `<div class="card login"><h3>Chargement impossible</h3><p>${esc(msg)}</p></div>`; }
function showLogin(auth, AU) {
  return new Promise(resolve => {
    const l = $('#loading');
    l.innerHTML = `<div class="card login"><div class="brand-mark" style="margin:0 auto 14px;width:40px;height:40px;border-radius:10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg></div>
      <h3>Chronocab</h3><p>Connectez-vous avec votre compte Google pour retrouver vos temps sur n’importe quel poste.</p>
      <button class="btn primary" id="login-btn" style="padding:10px 18px">Se connecter avec Google</button><div class="err" id="login-err"></div></div>`;
    const done = AU.onAuthStateChanged(auth, u => { if (u) { done(); resolve(u); } });
    $('#login-btn').onclick = async () => {
      $('#login-err').textContent = '';
      const prov = new AU.GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
      try { await AU.signInWithPopup(auth, prov); }
      catch (e) {
        const c = e && e.code;
        if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') { try { await AU.signInWithRedirect(auth, prov); } catch (e2) { $('#login-err').textContent = e2.code || String(e2); } }
        else if (c === 'auth/unauthorized-domain') $('#login-err').textContent = 'Ce site (' + location.hostname + ') n’est pas autorisé : ajoutez-le dans Firebase › Authentication › Paramètres › Domaines autorisés.';
        else if (c === 'auth/configuration-not-found' || c === 'auth/operation-not-allowed') $('#login-err').textContent = 'La connexion Google n’est pas activée dans Firebase › Authentication › Mode de connexion.';
        else if (c !== 'auth/popup-closed-by-user' && c !== 'auth/cancelled-popup-request') $('#login-err').textContent = 'Erreur : ' + (c || e);
      }
    };
  });
}

/* ---------- Toasts ---------- */
function toast(msg, actLabel, act) {
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button>${esc(actLabel)}</button>` : ''}`;
  $('#toasts').appendChild(t);
  if (actLabel) t.querySelector('button').onclick = () => { act(); t.remove(); };
  setTimeout(() => t.remove(), actLabel ? 7000 : 3500);
}

/* =========================================================
   Démarrage
   ========================================================= */
async function boot() {
  initTimerBar();
  bindChrono(); bindReports(); bindBilling(); bindRefs();
  // Le runtime de l'artifact peut s'installer juste après le chargement
  if (!FIREBASE_CONFIG.apiKey && !(window.claude && window.claude.use)) await new Promise(r => setTimeout(r, 400));
  await Store.init();
  $('#loading').remove();
  UI.draft.billable = !!S.meta.settings.defaultBillable;
  syncTimerBar();
  route();
  setInterval(tick, 1000);
}
boot();
</script>
